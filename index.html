<title>競艇大当たり予想</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg:    #080d1a;
  --bg2:   #0f1729;
  --bg3:   #182036;
  --fg:    #eef2ff;
  --fg2:   #7788aa;
  --gold:  #f5c518;
  --blue:  #3b82f6;
  --red:   #ef4444;
  --purple:#a855f7;
  --green: #22c55e;
  --orange:#f97316;
  --r:     8px;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  padding-bottom:16px;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  background:var(--bg2);z-index:21;
}
.hdr{
  background:var(--bg2);
  border-bottom:2px solid var(--gold);
  padding:10px max(16px,env(safe-area-inset-left,0px));
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:20;
}
.hdr-top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:19px;font-weight:900;color:var(--gold);letter-spacing:.04em}
.brand-sub{font-size:10px;font-weight:500;color:var(--fg2);margin-left:6px;vertical-align:middle}
.clock{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.hdr-info{margin-top:5px;font-size:11px;color:var(--fg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge-v{background:#1a2a40;border:1px solid #2a4060;padding:2px 10px;border-radius:20px;color:var(--gold);font-weight:700;font-size:11px}
.hit-rate{color:var(--green);font-weight:700}
.tabs-wrap{
  overflow-x:auto;white-space:nowrap;
  padding:8px max(16px,env(safe-area-inset-left,0px));
  background:var(--bg2);
  border-bottom:2px solid #182036;
  scrollbar-width:none;
  position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 68px);
  z-index:19;
}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab{
  display:inline-block;padding:5px 14px;margin-right:6px;
  border-radius:20px;border:1px solid #2a3a55;
  background:transparent;color:var(--fg2);
  font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .18s;
}
.tab.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.main{
  padding:12px max(16px,env(safe-area-inset-left,0px)) 20px;
}
.venue-title{font-size:13px;color:var(--fg2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bg3)}
.venue-title strong{color:var(--fg);font-weight:700}
.card{background:var(--bg2);border-radius:var(--r);border:1px solid #182036;overflow:hidden;margin-bottom:10px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--bg3)}
.r-num{font-size:14px;font-weight:700}
.r-time{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.b-wait{background:#1f1800;color:var(--orange);border:1px solid #f9731630}
.b-open{background:#0d2010;color:var(--green);border:1px solid #22c55e30;animation:blink 1.6s infinite}
.b-done{background:#111318;color:#445;border:1px solid #22273040}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.wait-body{padding:14px;text-align:center}
.wait-icon{font-size:22px;margin-bottom:4px}
.wait-txt{font-size:12px;color:var(--orange);font-weight:700;margin-bottom:2px}
.wait-sub{font-size:11px;color:var(--fg2)}
.wait-soon{font-size:11px;color:#ff9944;margin-top:4px;font-weight:600}
.pred-wrap{padding:12px 14px}
.pred-comment{font-size:11px;color:var(--fg2);margin-bottom:10px;padding:7px 10px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--gold);line-height:1.7}
.boat-table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px}
.boat-table th{background:var(--bg3);color:var(--fg2);padding:4px 8px;text-align:left;font-weight:500}
.boat-table td{padding:4px 8px;border-top:1px solid #182036}
.boat-no{font-weight:700;font-variant-numeric:tabular-nums;width:28px}
.bn2{color:#000;background:#111;display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:2px}
.bn2.c1{background:#fff;color:#000}
.bn2.c2{background:#222;color:#fff}
.bn2.c3{background:#c00;color:#fff}
.bn2.c4{background:#00a;color:#fff}
.bn2.c5{background:#ff0;color:#000}
.bn2.c6{background:#0a0;color:#fff}
.boat-comment{color:var(--fg)}
.boat-eval{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;white-space:nowrap}
.ev-good{background:#0d2010;color:var(--green)}
.ev-mid{background:#1a1a00;color:#cc0}
.ev-bad{background:#200808;color:var(--red)}
.pred-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pbox{background:var(--bg);border-radius:var(--r);padding:10px 12px;border:1px solid #182036}
.plabel{font-size:10px;color:var(--fg2);margin-bottom:3px;font-weight:500}
.pval{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pval.c-blue{color:var(--blue)}
.pval.c-purple{color:var(--purple)}
.pval.c-red{color:var(--red)}
.pval.c-gold{color:var(--gold)}
.phint{font-size:10px;color:var(--fg2);margin-top:2px}
.sim-wrap{background:var(--bg3);border-radius:6px;padding:10px 12px;margin-bottom:4px}
.sim-title{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:7px}
.sim-btns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.sim-btn{
  padding:4px 12px;border-radius:4px;border:1px solid #334;
  background:var(--bg2);color:var(--fg2);font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .15s;
}
.sim-btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.sim-result{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}
.sim-row{background:var(--bg2);padding:5px 8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
.sim-label{color:var(--fg2)}
.sim-pay{font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.card-footer{padding:5px 14px 8px;font-size:10px;color:#334;text-align:center;border-top:1px solid #182036}
.done-body{padding:10px 14px;color:#445;font-size:12px;text-align:center}
</style>

<div class="hdr">
  <div class="hdr-top">
    <div class="brand">競艇大当たり予想<span class="brand-sub">BOAT RACE PREDICTION</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="hdr-info">
    <span id="today-date"></span>
    <span class="badge-v" id="venue-count">本日0場開催</span>
    <span class="hit-rate" id="hit-rate-val"></span>
  </div>
</div>

<div class="tabs-wrap" id="tabs"></div>

<div class="main">
  <div class="venue-title" id="vtitle"></div>
  <div id="races"></div>
</div>

<script src="./script.js?v=20261106e"></script>
