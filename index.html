<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT RACE OOATARI</title><style>body{font-family:system-ui;background:#101d30;color:#eef5ff;margin:0}header,main{padding:20px;max-width:920px;margin:auto}section{background:#203652;border-radius:12px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.card{background:#345271;padding:14px;border-radius:9px}button,select{padding:12px;margin:5px;background:#315e90;color:white;border:1px solid #7ea1c7;border-radius:8px}.note{color:#ffdc8a}a{color:#a8d5ff}</style><header><h1>🚤 BOAT RACE OOATARI</h1><b class="note">事前・直前情報の取得と分析は未実装です。予想は表示しません。</b></header><main><section><h2>本日の開催場 <span id="date"></span></h2><p id="status">確認中</p><div class="grid" id="venues"></div><p><a href="https://www.boatrace.jp/owpc/pc/race/index">公式開催日程</a></p><button onclick="load()">更新</button></section><section><h2>レースを選択</h2><select id="place"></select><select id="race"></select></section><section><h2>予想情報</h2><div id="picks" class="grid"></div></section></main><script>
const $=s=>document.getElementById(s),places=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];let ready=false,last=null;const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());for(let i=1;i<=12;i++)$('race').add(new Option(i+'R',i));function hash(s){return [...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)}function pick(){let n=hash(today()+$('place').value+$('race').value),a=[4,5,6][n%3],b=[4,5,6][(n+1)%3],c=[1,2,3][n%3];return {'2連複':'1 - 2','2連単':a+' - '+b,'3連複':'1 - 2 - '+[3,4,5,6][n%4],'3連単':a+' - '+b+' - '+c}}function show(){$('picks').innerHTML='<p role="status" style="font-size:1.35rem;font-weight:700;color:#ffdc8a">事前+直前 情報 待ち</p>';}
async function load(){let d=today();$('date').textContent=d;try{let r=await fetch('data/today.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('未取得');let x=await r.json();if(x.status!=='verified'||x.date!==d||!Array.isArray(x.venues)||!x.venues.length||x.venues.some(v=>!places.includes(v)))throw Error('本日の公式データ未確認');$('status').textContent='確認済み '+x.venues.length+'場';$('venues').innerHTML=x.venues.map(v=>'<div class="card">'+v+'</div>').join('');$('place').innerHTML=x.venues.map(v=>'<option>'+v+'</option>').join('')}catch(e){$('status').textContent='本日の開催場は未確認です。架空の開催場は表示しません。';$('venues').innerHTML='';$('place').innerHTML='<option>未確認</option>'}show()}load();setInterval(()=>{if($('date').textContent!==today())load()},60000);setInterval(load,1200000);
</script></html>
